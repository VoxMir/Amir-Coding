<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | JonMir</title>

    <link rel="icon"
        href="https://s3.getstickerpack.com/storage/uploads/sticker-pack/flork-stickers-hd-vol-2/sticker_18.png?b9f7e18dbaf8c330e2d0137f4d9e735a&d=200x200">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.75),
                    rgba(236, 211, 211, 0.85)
                ),
                url("{{ url_for('static', filename='images/about.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 30px 15px;
        }


        .register-container {
            width: min(450px, 92%);
        }


        .register-box {

            width: 100%;

            padding: 42px;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.20);

            animation: appear 0.6s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .heart {

            text-align: center;

            color: #a26f6f;

            font-size: 27px;

            margin-bottom: 10px;
        }


        .small-title {

            text-align: center;

            color: #9b6b6b;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }


        h1 {

            font-family: Georgia, serif;

            font-size: 40px;

            color: #382b2b;

            text-align: center;

            margin-bottom: 10px;
        }


        .description {

            color: #6a5a5a;

            font-size: 14px;

            line-height: 1.6;

            text-align: center;

            margin-bottom: 28px;
        }


        .form-group {

            text-align: left;

            margin-bottom: 17px;
        }


        label {

            display: block;

            color: #4b3d3d;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .required {

            color: #a26f6f;
        }


        input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d6bcbc;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.7);

            color: #3d3030;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }


        input::placeholder {

            color: #a99a9a;
        }


        input:hover {

            border-color: #c5a5a5;
        }


        input:focus {

            border-color: #a26f6f;

            box-shadow:
                0 0 0 3px rgba(162, 111, 111, 0.12);

            transform: translateY(-1px);
        }


        input.error {

            border-color: #c65c5c;

            box-shadow:
                0 0 0 3px rgba(198, 92, 92, 0.08);
        }



        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 70px;
        }


        .show-password {

            position: absolute;

            right: 8px;

            top: 50%;

            transform: translateY(-50%);

            padding: 6px 9px;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: #765858;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

            transition: 0.2s ease;
        }


        .show-password:hover {

            background: rgba(162, 111, 111, 0.10);

            color: #684d4d;
        }


        .password-hint {

            margin-top: 6px;

            color: #8b7777;

            font-size: 12px;
        }


        .error-message {

            display: none;

            margin-top: 6px;

            color: #b44747;

            font-size: 12px;
        }


        .terms {

            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin: 8px 0 5px;
        }


        .terms input {

            width: 17px;

            height: 17px;

            margin-top: 2px;

            accent-color: #684d4d;

            cursor: pointer;
        }


        .terms label {

            margin: 0;

            color: #6a5a5a;

            font-weight: normal;

            font-size: 12px;

            line-height: 1.5;
        }


        .terms a {

            color: #9b6b6b;

            font-weight: 700;

            text-decoration: none;
        }


        .terms a:hover {

            color: #684d4d;

            text-decoration: underline;
        }


        .terms-error {

            margin-bottom: 5px;
        }


        .create-button {

            width: 100%;

            padding: 14px;

            margin-top: 12px;

            border: none;

            border-radius: 10px;

            background: #684d4d;

            color: #fff5f5;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .create-button:hover {

            background: #8c6464;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(89, 57, 57, 0.15);
        }


        .create-button:active {

            transform: translateY(0);
        }


        .create-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        .login-link {

            display: block;

            margin-top: 22px;

            text-align: center;

            color: #6a5a5a;

            font-size: 14px;

            text-decoration: none;
        }


        .login-link span {

            color: #9b6b6b;

            font-weight: 700;
        }


        .login-link:hover span {

            color: #684d4d;

            text-decoration: underline;
        }



        @media (max-width: 500px) {

            body {

                padding: 20px 12px;

                align-items: flex-start;
            }


            .register-container {

                margin-top: 20px;
            }


            .register-box {

                padding: 32px 24px;

                border-radius: 20px;
            }


            h1 {

                font-size: 34px;
            }

        }

    </style>

</head>


<body>

    <main class="register-container">

        <div class="register-box">

            <div class="heart">
                ♥
            </div>


            <div class="small-title">
                JonMir
            </div>


            <h1>
                Create Account
            </h1>


            <p class="description">
                Create your JonMir account and get started.
            </p>


            <form
                method="POST"
                action="{{ url_for('register') }}"
                onsubmit="return createAccount();"
            >



                <div class="form-group">

                    <label for="email">
                        Email Address
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <span
                        id="email-error"
                        class="error-message">
                    </span>

                </div>



                <div class="form-group">

                    <label for="username">
                        Username
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                    <span
                        id="username-error"
                        class="error-message">
                    </span>

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                        <span class="required">*</span>
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>


                    <div class="password-hint">
                        Use at least 8 characters.
                    </div>


                    <span
                        id="password-error"
                        class="error-message">
                    </span>

                </div>



                <div class="form-group">

                    <label for="date">
                        Date of Birth
                        <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                    <span
                        id="date-error"
                        class="error-message">
                    </span>

                </div>



                <div class="terms">

                    <input
                        type="checkbox"
                        id="checked"
                        name="terms"
                    >

                    <label for="checked">

                        I agree to the

                        <a href="rules.html">
                            Terms of Use
                        </a>

                    </label>

                </div>


                <span
                    id="checked-error"
                    class="error-message terms-error">
                </span>



                <button
                    type="submit"
                    id="createButton"
                    class="create-button"
                >
                    Create Account
                </button>


            </form>


            <a
                href="{{ url_for('handle_form') }}"
                class="login-link"
            >
                Already have an account?
                <span>Log in</span>
            </a>

        </div>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.getElementById("showPassword");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            } else {

                password.type = "password";

                button.textContent = "Show";

            }
        }


        function showError(id, message) {

            const error =
                document.getElementById(id);

            error.textContent = message;

            error.style.display = "block";
        }


        function clearErrors() {

            const errors =
                document.querySelectorAll(".error-message");


            errors.forEach(error => {

                error.style.display = "none";

                error.textContent = "";

            });


            const inputs =
                document.querySelectorAll("input");


            inputs.forEach(input => {

                input.classList.remove("error");

            });
        }


        function createAccount() {

            clearErrors();


            const email =
                document.getElementById("email").value.trim();


            const username =
                document.getElementById("username").value.trim();


            const password =
                document.getElementById("password").value;


            const date =
                document.getElementById("date").value;


            const checked =
                document.getElementById("checked").checked;


            let valid = true;


            if (email === "") {

                showError(
                    "email-error",
                    "Please enter your email."
                );

                document
                    .getElementById("email")
                    .classList.add("error");

                valid = false;

            } else if (!email.includes("@")) {

                showError(
                    "email-error",
                    "Please enter a valid email."
                );

                document
                    .getElementById("email")
                    .classList.add("error");

                valid = false;
            }


            if (username === "") {

                showError(
                    "username-error",
                    "Please choose a username."
                );

                document
                    .getElementById("username")
                    .classList.add("error");

                valid = false;
            }



            if (password === "") {

                showError(
                    "password-error",
                    "Please create a password."
                );

                document
                    .getElementById("password")
                    .classList.add("error");

                valid = false;

            } else if (password.length < 8) {

                showError(
                    "password-error",
                    "Password must contain at least 8 characters."
                );

                document
                    .getElementById("password")
                    .classList.add("error");

                valid = false;
            }



            if (date === "") {

                showError(
                    "date-error",
                    "Please enter your date of birth."
                );

                document
                    .getElementById("date")
                    .classList.add("error");

                valid = false;
            }



            if (!checked) {

                showError(
                    "checked-error",
                    "You must accept the Terms of Use."
                );

                valid = false;
            }



            if (valid) {

                const button =
                    document.getElementById("createButton");


                button.textContent =
                    "Creating Account...";

                button.disabled = true;


                return true;
            }


            return false;
        }

    </script>

</body>

</html>
