<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JonMir - Sign Up</title>

    <link rel="icon"
        href="https://s3.getstickerpack.com/storage/uploads/sticker-pack/flork-stickers-hd-vol-2/sticker_18.png?b9f7e18dbaf8c330e2d0137f4d9e735a&d=200x200">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    rgba(30, 30, 35, 0.75),
                    rgba(80, 227, 194, 0.45)
                ),
                url("https://static.vecteezy.com/system/resources/thumbnails/045/855/333/small/wall-grey-cement-texture-with-light-shadow-background-backdrop-gray-concrete-floor-room-surface-with-cracked-texture-pattern-banner-background-for-loft-design-concepts-vector.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 30px 15px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        }

        .title h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .title p {
            margin-top: 8px;
            color: #e5e7eb;
            font-size: 0.95rem;
        }

        .signup-box {
            width: 100%;
            padding: 35px;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(80, 227, 194, 0.15);

            backdrop-filter: blur(12px);

            display: flex;
            flex-direction: column;

            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-box h2 {
            margin: 0 0 6px;
            color: #252532;
            font-size: 1.5rem;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 25px;
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #30303e;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 13px;

            border: 2px solid #e0e2e7;
            border-radius: 10px;

            background: #ffffff;
            color: #30303e;

            font-size: 0.95rem;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        input:hover {
            border-color: #b8c0cc;
        }

        input:focus {
            border-color: #50cfae;

            box-shadow:
                0 0 0 4px rgba(80, 207, 174, 0.15);

            transform: translateY(-1px);
        }

        input.error {
            border-color: #ef4444;
        }

        .error-message {
            display: none;
            margin-top: 5px;

            color: #dc2626;
            font-size: 0.8rem;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            padding: 6px 9px;

            border: none;
            border-radius: 7px;

            background: transparent;
            color: #555;

            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .show-password:hover {
            background: #f0f0f0;
            color: #222;
        }

        .password-hint {
            margin-top: 6px;

            color: #777;
            font-size: 0.75rem;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            margin: 8px 0 5px;
        }

        .terms input {
            width: 17px;
            height: 17px;

            margin-top: 2px;

            accent-color: #50cfae;

            cursor: pointer;
        }

        .terms label {
            margin: 0;

            color: #555;
            font-weight: normal;
            font-size: 0.85rem;

            line-height: 1.4;
        }

        .terms a {
            color: #159a7d;
            font-weight: bold;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .terms-error {
            margin-bottom: 15px;
        }

        .create-button {
            width: 100%;

            padding: 13px;

            margin-top: 12px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #30303e,
                #159a7d
            );

            color: white;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(21, 154, 125, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .create-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(21, 154, 125, 0.35);
        }

        .create-button:active {
            transform: translateY(0);
        }

        .login-link {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #30303e;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .login-link span {
            color: #159a7d;
            font-weight: bold;
        }

        .login-link:hover span {
            text-decoration: underline;
        }

        .required {
            color: #ef4444;
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
                align-items: flex-start;
            }

            .signup-container {
                margin-top: 20px;
            }

            .signup-box {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .title h1 {
                font-size: 1.6rem;
            }
        }
    </style>

    <script>

        function sendtorules() {
            window.location.href = "rules.html";
        }

        function sendtologin() {
            window.location.href = "/";
        }

        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.getElementById("showPassword");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }

        function showError(id, message) {
            const error = document.getElementById(id);

            error.textContent = message;
            error.style.display = "block";
        }

        function clearErrors() {

            const errors = document.querySelectorAll(".error-message");

            errors.forEach(error => {
                error.style.display = "none";
                error.textContent = "";
            });

            const inputs = document.querySelectorAll("input");

            inputs.forEach(input => {
                input.classList.remove("error");
            });
        }

        function createAccount() {

            clearErrors();

            const email =
                document.getElementById("email").value.trim();

            const firstname =
                document.getElementById("firstname").value.trim();

            const lastname =
                document.getElementById("lastname").value.trim();

            const password =
                document.getElementById("password").value;

            const date =
                document.getElementById("date").value;

            const checked =
                document.getElementById("checked").checked;

            let valid = true;


            if (email === "") {

                showError(
                    "email-error",
                    "Please enter your email."
                );

                document.getElementById("email")
                    .classList.add("error");

                valid = false;

            } else if (!email.includes("@")) {

                showError(
                    "email-error",
                    "Please enter a valid email."
                );

                document.getElementById("email")
                    .classList.add("error");

                valid = false;
            }


            if (firstname === "") {

                showError(
                    "firstname-error",
                    "Please enter your first name."
                );

                document.getElementById("firstname")
                    .classList.add("error");

                valid = false;
            }


            if (lastname === "") {

                showError(
                    "lastname-error",
                    "Please enter your last name."
                );

                document.getElementById("lastname")
                    .classList.add("error");

                valid = false;
            }


            if (password === "") {

                showError(
                    "password-error",
                    "Please create a password."
                );

                document.getElementById("password")
                    .classList.add("error");

                valid = false;

            } else if (password.length < 8) {

                showError(
                    "password-error",
                    "Password must contain at least 8 characters."
                );

                document.getElementById("password")
                    .classList.add("error");

                valid = false;
            }



            if (date === "") {

                showError(
                    "date-error",
                    "Please enter your date of birth."
                );

                document.getElementById("date")
                    .classList.add("error");

                valid = false;
            }



            if (!checked) {

                showError(
                    "checked-error",
                    "You must accept the Terms of Use."
                );

                valid = false;
            }


            if (valid) {

                const button =
                    document.getElementById("createButton");

                button.textContent = "Creating Account...";
                button.disabled = true;

                setTimeout(() => {
                    window.location.href = "/";
                }, 800);
            }

            return false;
        }

    </script>

</head>


<body>

    <main class="signup-container">

        <div class="title">


        </div>


        <div class="signup-box">

            <h2>Create Your Account</h2>

            <p class="subtitle">
                Fill in your information to get started.
            </p>


            <form onsubmit="return createAccount();">


                <div class="form-group">

                    <label for="email">
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                    <span
                        id="email-error"
                        class="error-message">
                    </span>

                </div>

                <div class="form-group">

                    <label for="firstname">
                        First Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        placeholder="Your first name"
                        autocomplete="given-name"
                    >

                    <span
                        id="firstname-error"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="lastname">
                        Last Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        placeholder="Your last name"
                        autocomplete="family-name"
                    >

                    <span
                        id="lastname-error"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password <span class="required">*</span>
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            onclick="togglePassword()">

                            Show

                        </button>

                    </div>

                    <div class="password-hint">
                        Use at least 8 characters.
                    </div>

                    <span
                        id="password-error"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="date">
                        Date Of Birth <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                    <span
                        id="date-error"
                        class="error-message">
                    </span>

                </div>


                <div class="terms">

                    <input
                        type="checkbox"
                        id="checked"
                        name="terms"
                    >

                    <label for="checked">

                        I accept the

                        <a
                            href="rules.html"
                            onclick="sendtorules(); return false;">

                            Terms of Use

                        </a>

                    </label>

                </div>

                <span
                    id="checked-error"
                    class="error-message terms-error">
                </span>

                <button
                    type="submit"
                    id="createButton"
                    class="create-button">

                    Create Account

                </button>

                <a
                    href="/"
                    class="login-link"
                    onclick="sendtologin(); return false;">

                    Already have an account?
                    <span>Log in</span>

                </a>

            </form>

        </div>

    </main>

</body>

</html>
