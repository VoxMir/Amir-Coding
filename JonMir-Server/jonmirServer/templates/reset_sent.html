<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Link Sent | JonMir</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.75),
                    rgba(236, 211, 211, 0.85)
                ),
                url("{{ url_for('static', filename='images/about.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 20px;
        }

        .box {
            width: min(450px, 100%);

            padding: 45px;

            text-align: center;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.2);

            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            color: #a26f6f;
            font-size: 35px;
            margin-bottom: 15px;
        }

        .small-title {
            color: #9b6b6b;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;

            font-size: 38px;

            color: #382b2b;

            margin-bottom: 15px;
        }

        p {
            color: #6a5a5a;

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .email {
            display: inline-block;

            padding: 12px 18px;

            margin-bottom: 25px;

            background: rgba(162, 111, 111, 0.1);

            border-radius: 10px;

            color: #684d4d;

            font-weight: 700;
        }

        .back {
            display: block;

            padding: 13px;

            background: #684d4d;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-weight: 700;

            transition: 0.3s ease;
        }

        .back:hover {
            background: #8c6464;
            transform: translateY(-2px);
        }

    </style>

</head>

<body>

    <div class="box">

        <div class="heart">
            ♥
        </div>

        <div class="small-title">
            JonMir
        </div>

        <h1>
            Check Your Email
        </h1>

        <p>
            If an account exists with this email,
            we've sent instructions to reset your password.
        </p>

        <div class="email">
            {{ email }}
        </div>

        <a
            href="{{ url_for('handle_form') }}"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</body>

</html>
