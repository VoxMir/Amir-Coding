<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JonMir Projects</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.72),
                    rgba(236, 211, 211, 0.86)
                ),
                url("{{ url_for('static', filename='images/applicationsbackground.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .projects-container {
            width: min(900px, 90%);

            padding: 55px 50px;

            text-align: center;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.2);
        }

        .heart {
            color: #a26f6f;

            font-size: 27px;

            margin-bottom: 10px;
        }

        .small-title {
            color: #9b6b6b;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;

            font-size: 42px;

            color: #382b2b;

            margin-bottom: 12px;
        }

        .description {
            color: #6a5a5a;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 45px;
        }

        .projects {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 25px;
        }

        .project-btn {
            width: 45%;

            padding: 15px 20px;

            border: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 12px;

            text-decoration: none;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #fff5f5;

            font-size: 15px;

            font-weight: 700;

            background: #684d4d;

            box-shadow:
                0 8px 20px rgba(89, 57, 57, 0.12);

            transition: 0.3s ease;
        }

        .project-btn:hover {
            background: #8c6464;

            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(89, 57, 57, 0.18);
        }

        .project-btn::before {
            content: "♥";

            color: #f3caca;

            margin-right: 8px;

            font-size: 13px;
        }

        footer {
            margin-top: 65px;

            padding-top: 22px;

            border-top: 1px solid rgba(155, 107, 107, 0.2);

            color: #9b6b6b;

            font-size: 13px;
        }

        footer strong {
            color: #684d4d;

            font-family: Georgia, serif;

            font-size: 15px;
        }

        @media (max-width: 650px) {

            .projects-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                margin-bottom: 35px;
            }

            .projects {
                flex-direction: column;

                gap: 15px;
            }

            .project-btn {
                width: 100%;
            }

            footer {
                margin-top: 45px;
            }
        }

    </style>

</head>

<body>

    <div class="projects-container">

        <div class="heart">
            ♥
        </div>

        <div class="small-title">
            JonMir
        </div>

        <h1>
            JonMir Projects
        </h1>

        <p class="description">
            Choose whether you want to check Amir or Jon's projects!
        </p>

        <div class="projects">

            <a
                href="https://github.com/VoxMir/"
                class="project-btn"
            >
                Check Amir's Github
            </a>

            <a
                href="https://github.com/Eclipse7899"
                class="project-btn"
            >
                Check Jon's Github
            </a>

        </div>

        <footer>
            <strong>JonMir ツ</strong> · © 2026
        </footer>

    </div>

</body>

</html>
