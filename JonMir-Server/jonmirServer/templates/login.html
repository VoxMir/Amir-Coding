<!DOCTYPE html>
<html>
    <head>
        <style>
        div {
        color: rgb(246, 245, 245);
        padding: 5px;
        font-family: Arial, Helvetica, sans-serif;
        }

        a {
        text-decoration: none;
        color: rgb(175, 94, 94);
        font-weight: bolder;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .login-input {
        width: 300px;
        padding: 12px 15px;
        border: 2px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
        }
        </style>
    </head>
<body style="
    display: flex;
    flex-direction: column;
    justify-content: stretch;
    align-items: center;   
    padding: 10%;
    background: linear-gradient(90deg,rgb(17, 19, 54) 2%, rgba(40, 2, 120, 1) 21%, rgba(32, 96, 138, 1) 100%);">
            <div>
                <div>
                    <div>
                        <div style="display: flex; flex-direction: row; justify-content: center; max-width: max; font-weight: bold; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: 30px;" >JonMir World / Login</div>
                        <form action="{{ url_for('handle_form') }}" method="POST">
                        <div>
                            <input required
                                placeholder="Username" name="username" class="login-input"
                                class="min-w-28 px-4 py-3 self-stretch bg-white rounded">
                        </div>
                        <div>
                            <input required type="password" name="password"
                                placeholder="Password" class="login-input"
                                class="min-w-28 px-4 py-3 self-stretch bg-white rounded">
                        </div>
                        <div>
                            <div class="flex gap-1.5">
                                <input type="checkbox" id="optionalCheckbox">
                                <div style="display: inline;">
                                    Remember Me
                                </div>
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column; justify-content: center;">
                            <button type="submit"
                                id="wayToAccount"
                                class="flex-1 text-center p-3 bg-zinc-700 rounded-3xl text-white;" style="padding: 5px; font-weight: bold; font-size: large;">
                                Login
                            </button><br>
                            <a href="jonmir.html" type="button"
                                class="flex- text-nowrap p-3 bg-zinc-700 rounded-3xl text-white">
                                Forgot Email / Reset Password
                            </a>
                        </form>
                        </div>
                        <div class="flex flex-row" style="display: inline;">
                            <div data-layer="Don’t have an account?"
                                class="justify-start text-white text-base font-normal font-['Inter'] leading-4">Don’t
                                have an account?
                            </div>
                            <div style="display: inline; align-items: center;">
                                <a href="register.html">Create
                                    Account
                                </a>
                            </div>
                        </div><br><br><br>
                        <div style="display: flex; flex-direction: row; justify-content: center;">
                            <button onclick="document.getElementById('music').play()">
                            🎵 Play Music
                            </button><audio id="music" loop>
                            <source src="{{ url_for('static', filename='hootie.mp3') }}" type="audio/mpeg">
                            </audio>  
                        </div>
                    </div>
                </div>
</html>
