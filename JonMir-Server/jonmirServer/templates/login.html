<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | JonMir</title>


    <script>
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorBox = document.querySelector(".login-error");

        function clearLoginError() {
            if (errorBox) {
                errorBox.remove();
            }
        }

        usernameInput.addEventListener("input", clearLoginError);
        passwordInput.addEventListener("input", clearLoginError);
    </script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.75),
                    rgba(236, 211, 211, 0.85)
                ),
                url("{{ url_for('static', filename='images/about.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-box {
            width: min(430px, 90%);

            padding: 45px;

            text-align: center;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.2);
        }

        .heart {
            color: #a26f6f;

            font-size: 27px;

            margin-bottom: 10px;
        }

        .small-title {
            color: #9b6b6b;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;

            font-size: 42px;

            color: #382b2b;

            margin-bottom: 10px;
        }

        .description {
            color: #6a5a5a;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #4b3d3d;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d6bcbc;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.7);

            color: #3d3030;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }

        input::placeholder {
            color: #a99a9a;
        }

        input:focus {
            border-color: #a26f6f;

            box-shadow:
                0 0 0 3px rgba(162, 111, 111, 0.12);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #684d4d;

            color: #fff5f5;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #8c6464;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(89, 57, 57, 0.15);
        }

        .links {
            margin-top: 22px;
        }

        .link {
            display: block;

            color: #9b6b6b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            margin-top: 10px;

            transition: 0.3s ease;
        }

        .link:hover {
            color: #684d4d;
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0 15px;

            color: #a98b8b;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(155, 107, 107, 0.25);
        }

        .register {
            color: #6a5a5a;

            font-size: 14px;
        }

        .register a {
            color: #9b6b6b;

            font-weight: 700;

            text-decoration: none;
        }

        .register a:hover {
            color: #684d4d;
        }

        @media (max-width: 500px) {

            .login-box {
                padding: 35px 25px;
            }

            h1 {
                font-size: 34px;
            }

        }

            .login-error {
                margin-bottom: 20px;
                padding: 12px 15px;

                border-radius: 10px;

                background: rgba(198, 92, 92, 0.12);
                border: 1px solid rgba(198, 92, 92, 0.3);

                color: #a33f3f;

                font-size: 13px;
                font-weight: 700;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="heart">
            ♥
        </div>

        <div class="small-title">
            JonMir
        </div>

        <h1>
            Welcome
        </h1>

        <p class="description">
            Sign in to continue to your JonMir account.
        </p>
                {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
                {% endif %}

            <form method="POST" action="{{ url_for('handle_form') }}">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Sign In
            </button>

        </form>

        <div class="links">

            <a
                href="{{ url_for('respassword') }}"
                class="link"
            >
                Forgot your password?
            </a>

            <a
                href="{{ url_for('changeemail') }}"
                class="link"
            >
                Don't remember your email?
            </a>

        </div>

        <div class="divider">
            OR
        </div>

        <div class="register">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create one
            </a>
        </div>

    </div>

</body>

</html>
