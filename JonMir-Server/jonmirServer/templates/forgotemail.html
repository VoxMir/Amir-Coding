<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Email | JonMir</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.75),
                    rgba(236, 211, 211, 0.85)
                ),
                url("{{ url_for('static', filename='images/about.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .forgot-box {

            width: min(450px, 90%);

            padding: 45px;

            text-align: center;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.20);
        }


        /* =========================
           HEART
        ========================= */

        .heart {

            color: #a26f6f;

            font-size: 27px;

            margin-bottom: 12px;
        }


        /* =========================
           SMALL TITLE
        ========================= */

        .small-title {

            color: #9b6b6b;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            font-family: Georgia, serif;

            font-size: 42px;

            color: #382b2b;

            margin-bottom: 15px;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {

            color: #6a5a5a;

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================= */

        .input-group {

            text-align: left;

            margin-bottom: 18px;
        }


        label {

            display: block;

            color: #4b3d3d;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d6bcbc;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.7);

            color: #3d3030;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }


        input:focus {

            border-color: #a26f6f;

            box-shadow:
                0 0 0 3px rgba(162, 111, 111, 0.12);
        }


        input::placeholder {

            color: #a99a9a;
        }


        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #684d4d;

            color: #fff5f5;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }


        button:hover {

            background: #8c6464;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(89, 57, 57, 0.15);
        }


        /* =========================
           BACK LINKS
        ========================= */

        .back {

            display: inline-block;

            margin-top: 25px;

            color: #9b6b6b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition: 0.3s ease;
        }


        .back:hover {

            color: #684d4d;
        }


        .reset-link {

            display: block;

            margin-top: 12px;

            color: #6a5a5a;

            text-decoration: none;

            font-size: 13px;

            transition: 0.3s ease;
        }


        .reset-link:hover {

            color: #9b6b6b;
        }


        /* =========================
           INFO BOX
        ========================= */

        .info {

            margin-top: 25px;

            padding: 14px;

            border-radius: 12px;

            background: rgba(162, 111, 111, 0.10);

            color: #6a5a5a;

            font-size: 12px;

            line-height: 1.6;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .forgot-box {

                padding: 35px 25px;
            }


            h1 {

                font-size: 34px;
            }

        }

    </style>

</head>


<body>


    <div class="forgot-box">


        <div class="heart">
            ♥
        </div>


        <div class="small-title">
            JonMir
        </div>


        <h1>
            Forgot Email?
        </h1>


        <p class="description">

            No worries. Enter the information
            associated with your account and we'll
            help you find your email address.

        </p>


        <form
            method="POST"
            action="{{ url_for('changeemail') }}"
        >


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <button type="submit">
                Find My Email
            </button>


        </form>


        <div class="info">

            For your security, we'll only show
            information that can safely be associated
            with your account.

        </div>


        <a
            href="{{ url_for('respassword') }}"
            class="reset-link"
        >
            Remember your email? Reset your password
        </a>


        <a
            href="{{ url_for('handle_form') }}"
            class="back"
        >
            ← Back to Login
        </a>


    </div>


</body>

</html>
