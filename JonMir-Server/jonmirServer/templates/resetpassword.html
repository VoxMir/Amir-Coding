<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | JonMir</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: #3d3030;

            background:
                linear-gradient(
                    rgba(255, 236, 236, 0.75),
                    rgba(236, 211, 211, 0.85)
                ),
                url("{{ url_for('static', filename='images/about.jpg') }}");

            background-size: cover;
            background-position: center;
        }

        .reset-box {
            width: min(430px, 90%);

            padding: 45px;

            text-align: center;

            background: rgba(255, 248, 248, 0.72);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(89, 57, 57, 0.2);
        }

        .heart {
            color: #a26f6f;

            font-size: 25px;

            margin-bottom: 10px;
        }

        .small-title {
            color: #9b6b6b;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;

            font-size: 42px;

            color: #382b2b;

            margin-bottom: 15px;
        }

        .description {
            color: #6a5a5a;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #4b3d3d;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d6bcbc;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.7);

            color: #3d3030;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }

        input:focus {
            border-color: #a26f6f;

            box-shadow:
                0 0 0 3px rgba(162, 111, 111, 0.12);
        }

        .submit-btn {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #684d4d;

            color: #fff5f5;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .submit-btn:hover {
            background: #8c6464;

            transform: translateY(-2px);
        }

        /* Don't remember email button */

        .forgot-email {
            display: block;

            width: 100%;

            padding: 12px;

            margin-top: 12px;

            border: 1px solid #c9a8a8;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.35);

            color: #765858;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            transition: 0.3s ease;
        }

        .forgot-email:hover {
            background: rgba(255, 255, 255, 0.7);

            border-color: #a26f6f;

            color: #684d4d;

            transform: translateY(-2px);
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0 5px;

            color: #a98b8b;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(155, 107, 107, 0.25);
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #9b6b6b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition: 0.3s ease;
        }

        .back:hover {
            color: #684d4d;
        }

    </style>
</head>

<body>

    <div class="reset-box">

        <div class="heart">♥</div>

        <div class="small-title">
            JonMir
        </div>

        <h1>Reset Password</h1>

        <p class="description">
            Enter your email address and we'll send you
            instructions to reset your password.
        </p>

        <form method="POST" action="{{ url_for('respassword') }}">

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <button type="submit" class="submit-btn">
                Send Reset Link
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <a href="{{ url_for('changeemail') }}" class="forgot-email">
            Don't remember your email?
        </a>

        <a href="{{ url_for('handle_form') }}" class="back">
            ← Back to Login
        </a>

    </div>

</body>

</html>
